<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Rebornly</title>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
  <meta name="theme-color" content="#F6EFE6">
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/png" href="/assets/branding/favicon2.png">
  <style>
    /* Where the Supabase function market-return sends the browser after a Stripe
       Checkout or seller onboarding. No script, and the address's query is never
       read: every visit shows the same two lines. */
    :root{
      color-scheme:light;
      --ground:#F6EFE6;--card:#fbf7f4;--ink:#2B211B;--line:#e6dfd7;--shadow:rgba(90,61,56,.09);
      --serif:"Noto Serif","DM Serif Display",Georgia,"Times New Roman",serif;
      --sans:Inter,Roboto,"Helvetica Neue",Arial,system-ui,-apple-system,sans-serif;
    }
    *{box-sizing:border-box}
    html,body{background:var(--ground)}
    body{margin:0;min-height:100svh;display:grid;place-items:center;padding:24px 16px;font-family:var(--sans);color:var(--ink);line-height:1.55;-webkit-font-smoothing:antialiased}
    main{width:min(100%,460px)}
    .brand{display:flex;justify-content:center;margin-bottom:20px}
    .brand img{width:135px;height:auto}
    .card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:28px 24px;box-shadow:0 12px 40px var(--shadow)}
    h1{margin:0 0 8px;font-family:var(--serif);font-weight:400;font-size:1.75rem;line-height:1.2;color:var(--ink)}
    p{margin:0;color:var(--ink)}
  </style>
</head>
<body>
<main>
  <div class="brand"><img src="/assets/branding/rebornly_logo.png" alt="Rebornly" width="539" height="160"></div>
  <div class="card">
    <h1>Return to Rebornly</h1>
    <p>You can close this page.</p>
  </div>
</main>
</body>
</html>
